[project]
name = "prefkit"
version = "0.1.0"
description = "Preference-data routing, evaluation and annotation with a game layer."
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"manage.py" = ["D"]
"prefkit/migrations/*" = ["D", "E", "I", "UP"]

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>prefkit · change password</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; max-width: 480px; }
    label { display: block; margin-top: 8px; }
    input { width: 100%; padding: 6px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 6px 16px; }
    .errorlist { color: #b00020; padding-left: 16px; }
  </style>
</head>
<body>
  <p><a href="{% url 'prefkit:index' %}">Back to datasets</a></p>
  <h1>Change password</h1>
  <p>Signed in as <strong>{{ user.get_username }}</strong>.</p>

  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label for="{{ form.old_password.id_for_label }}">Current password</label>
    {{ form.old_password.errors }}{{ form.old_password }}
    <label for="{{ form.new_password1.id_for_label }}">New password</label>
    {{ form.new_password1.errors }}{{ form.new_password1 }}
    <label for="{{ form.new_password2.id_for_label }}">New password again</label>
    {{ form.new_password2.errors }}{{ form.new_password2 }}
    <button type="submit">Change password</button>
  </form>
</body>
</html>

# Optional: PostgreSQL and Redis for a production-like setup.
# Start with: docker compose up -d
# Then set PREFKIT_DB=postgres and REDIS_URL in .env.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: prefkit
      POSTGRES_USER: prefkit
      POSTGRES_PASSWORD: prefkit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
